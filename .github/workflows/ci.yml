name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_EXTENSIONS: mbstring, intl, bcmath, sodium, pdo_sqlite, sqlite3, pdo_mysql

jobs:
  quality:
    name: Style, static analysis, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
      - run: cp .env.example .env
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: php artisan key:generate
      - name: Code style
        run: vendor/bin/pint --test
      - name: Static analysis
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress
      - name: Known vulnerabilities in dependencies
        run: composer audit --no-interaction

  tests-sqlite:
    name: Tests (SQLite, PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
      - run: cp .env.example .env
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: php artisan key:generate
      - run: vendor/bin/pest

  # Same suite on the production engine: catches what SQLite forgives (invalid defaults, collations, FK order, DDL).
  tests-mysql:
    name: Tests (MySQL 8)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: edusmart_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psecret"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: edusmart_test
      DB_USERNAME: root
      DB_PASSWORD: secret
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
      - run: cp .env.example .env
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: php artisan key:generate
      - run: vendor/bin/pest

  api-docs:
    name: OpenAPI document builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
      - run: cp .env.example .env
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: php artisan key:generate
      - run: php artisan api:openapi --output=build/openapi.json
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: build/openapi.json
